<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — New Horizons by Claire Wallace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0a1a;
      color: #e8e4f5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse at top, rgba(93, 63, 160, 0.25), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(184, 149, 77, 0.15), transparent 60%);
    }
    .icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px solid #d4b87a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      color: #d4b87a;
      font-size: 1.75rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #e8e4f5;
      margin-bottom: 1rem;
    }
    h1 span { color: #d4b87a; }
    p {
      color: #b5add0;
      font-size: 1.05rem;
      max-width: 480px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
    }
    a {
      display: inline-block;
      padding: 1rem 2rem;
      background: #d4b87a;
      color: #0d0a1a;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    a:hover { background: #e8d6a8; }
  </style>
</head>
<body>
  <div class="icon">✦</div>
  <h1>Thank you for <span>reaching out.</span></h1>
  <p>Your message has been received. Claire will be in touch with you personally as soon as possible.</p>
  <a href="/">Return Home</a>
</body>
</html>
